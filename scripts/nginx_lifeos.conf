# Cấu hình Nginx tối ưu cho LifeOS (Chịu tải 500+ Người Dùng Đồng Thời)
# Vị trí đặt file trên VPS: /etc/nginx/sites-available/lifeos.conf
# Kích hoạt: ln -s /etc/nginx/sites-available/lifeos.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

# 1. Giới hạn tần suất yêu cầu để chống nghẽn và chống DDoS
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream lifeos_upstream {
    # Kết nối tới PM2 cluster chạy trên cổng 3000
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Tự động chuyển hướng toàn bộ sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL Certs (cấu hình qua Certbot: certbot --nginx -d yourdomain.com)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Tối ưu hóa
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tối ưu nén Gzip giảm băng thông
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 application/wasm;

    # Giới hạn kích thước file upload (avatar, tệp đính kèm)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # 1. Bảo vệ endpoint xác thực (Đăng nhập / Đăng ký)
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        
        proxy_pass http://lifeos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 2. Xử lý WebSocket & API chung
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://lifeos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Cache tối đa các file tĩnh (JS, CSS, Ảnh, Icons)
    location /assets/ {
        proxy_pass http://lifeos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 4. Phục vụ Frontend Web App
    location / {
        proxy_pass http://lifeos_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
